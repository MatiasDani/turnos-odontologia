<head>

<link rel="stylesheet" href="../../../../design-system/paleta-b.css">

<body>
<header class="r-head"><a class="brand" href="b-portada.html" aria-label="Turnos Odonto, inicio"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.6 3.5C5 3.5 3.5 5.6 3.5 8.2c0 2.2.9 3.6 1.5 5.2.8 2.1.9 7.1 2.7 7.1 1.6 0 1.5-4.7 4.3-4.7s2.7 4.7 4.3 4.7c1.8 0 1.9-5 2.7-7.1.6-1.6 1.5-3 1.5-5.2 0-2.6-1.5-4.7-4.1-4.7-1.9 0-2.8 1.1-4.4 1.1S9.5 3.5 7.6 3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><b data-brand-name>Turnos Odonto</b></a><span>Consultorio Odontológico Demo</span></header>
<main id="contenido" class="r-main" tabindex="-1">
  <div id="app">
    <div class="progress" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>
    <p class="step-label">Paso 1 de 4 · Prestación</p>
    <h1>¿Qué necesitás?</h1>
    <p class="lead">La duración es aproximada y la define el consultorio.</p>
    <fieldset class="rows"><legend class="visually-hidden">Prestación</legend>
      <label class="choice is-on"><input type="radio" name="prestacion" checked><span class="dot"></span><span class="grow">Consulta/control</span><span class="dur num">30 min</span></label>
      <label class="choice"><input type="radio" name="prestacion"><span class="dot"></span><span class="grow">Limpieza</span><span class="dur num">45 min</span></label>
      <label class="choice"><input type="radio" name="prestacion"><span class="dot"></span><span class="grow">Extracción simple</span><span class="dur num">60 min</span></label>
      <label class="choice"><input type="radio" name="prestacion"><span class="dot"></span><span class="grow">Endodoncia</span><span class="dur num">90 min</span></label>
    </fieldset>
    <div class="r-actions"><a class="link" href="b-portada.html">Volver al inicio</a><button type="button" class="btn btn-primary">Continuar</button></div>
    <p class="r-note">Podés cancelar o reprogramar online hasta 24 h antes del turno.</p>
  </div>
</main>
<span class="mock-note" aria-hidden="true">Mockup v2 · B · Clínico calmo · reserva paso 1</span>
